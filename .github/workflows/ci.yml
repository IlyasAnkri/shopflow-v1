name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and run Ruff
        run: |
          pip install ruff
          ruff check .
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: shopflow_user
          POSTGRES_PASSWORD: shopflow_password
          POSTGRES_DB: shopflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest requests
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://shopflow_user:shopflow_password@localhost:5432/shopflow_db
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Étape A : Compilation simple (S'exécute uniquement sur les Pull Requests)
      - name: Build Docker image (Test only)
        if: github.ref != 'refs/heads/main'
        run: docker build -t shopflow-api:ci-test .

      # Étape B : Connexion sécurisée (S'exécute uniquement sur main)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape C : Compilation finale et Push (S'exécute uniquement sur main)
      - name: Build and Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          # Extraction des 7 premiers caractères de l'ID du commit (SHA court)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/shopflow-api"

          # Construction avec deux tags (latest et le SHA)
          docker build -t $IMAGE:latest -t $IMAGE:$SHORT_SHA .

          # Envoi des images vers Docker Hub
          docker push $IMAGE:latest
          docker push $IMAGE:$SHORT_SHA
